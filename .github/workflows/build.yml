name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Crear proyecto
        run: |
          set -e
          D=app/src/main/java/com/example/recordatorios
          R=app/src/main/res
          mkdir -p $D $R/layout $R/xml $R/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Recordatorios"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.recordatorios"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.recordatorios"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Recordatorios"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".TaskWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/task_widget_info" />
                  </receiver>
                  <service
                      android:name=".TaskService"
                      android:exported="false"
                      android:permission="android.permission.BIND_REMOTEVIEWS" />
              </application>
          </manifest>
          EOF

          cat > $D/TaskStore.kt <<'EOF'
          package com.example.recordatorios

          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          data class Task(val id: Long, val text: String, val done: Boolean)

          object TaskStore {
              private const val PREFS = "tasks_prefs"
              private const val KEY = "items"

              @Synchronized
              fun load(ctx: Context): List<Task> {
                  val raw = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY, "[]") ?: "[]"
                  val arr = JSONArray(raw)
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      Task(o.getLong("id"), o.getString("text"), o.getBoolean("done"))
                  }
              }

              @Synchronized
              private fun save(ctx: Context, list: List<Task>) {
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(JSONObject().put("id", it.id).put("text", it.text).put("done", it.done))
                  }
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY, arr.toString()).apply()
                  refreshWidgets(ctx)
              }

              fun add(ctx: Context, text: String) {
                  if (text.isBlank()) return
                  save(ctx, load(ctx) + Task(System.currentTimeMillis(), text.trim(), false))
              }

              fun setDone(ctx: Context, id: Long, done: Boolean) {
                  save(ctx, load(ctx).map { if (it.id == id) it.copy(done = done) else it })
              }

              fun delete(ctx: Context, id: Long) {
                  save(ctx, load(ctx).filter { it.id != id })
              }

              fun refreshWidgets(ctx: Context) {
                  val mgr = AppWidgetManager.getInstance(ctx)
                  val ids = mgr.getAppWidgetIds(ComponentName(ctx, TaskWidget::class.java))
                  mgr.notifyAppWidgetViewDataChanged(ids, R.id.widget_list)
              }
          }
          EOF

          cat > $D/TaskWidget.kt <<'EOF'
          package com.example.recordatorios

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.widget.RemoteViews

          class TaskWidget : AppWidgetProvider() {

              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  ids.forEach { mgr.updateAppWidget(it, buildViews(ctx, it)) }
                  mgr.notifyAppWidgetViewDataChanged(ids, R.id.widget_list)
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  super.onReceive(ctx, intent)
                  if (intent.action == ACTION_DONE) {
                      val id = intent.getLongExtra(EXTRA_ID, -1L)
                      if (id != -1L) TaskStore.setDone(ctx, id, true)
                  }
              }

              private fun buildViews(ctx: Context, widgetId: Int): RemoteViews {
                  val views = RemoteViews(ctx.packageName, R.layout.widget_layout)

                  val svc = Intent(ctx, TaskService::class.java)
                  svc.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId)
                  svc.data = Uri.parse(svc.toUri(Intent.URI_INTENT_SCHEME))
                  views.setRemoteAdapter(R.id.widget_list, svc)
                  views.setEmptyView(R.id.widget_list, R.id.widget_empty)

                  val doneIntent = Intent(ctx, TaskWidget::class.java)
                  doneIntent.action = ACTION_DONE
                  val donePending = PendingIntent.getBroadcast(
                      ctx, 0, doneIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                  )
                  views.setPendingIntentTemplate(R.id.widget_list, donePending)

                  val open = PendingIntent.getActivity(
                      ctx, 1, Intent(ctx, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  views.setOnClickPendingIntent(R.id.widget_title, open)
                  views.setOnClickPendingIntent(R.id.widget_add, open)
                  return views
              }

              companion object {
                  const val ACTION_DONE = "com.example.recordatorios.ACTION_DONE"
                  const val EXTRA_ID = "task_id"
              }
          }
          EOF

          cat > $D/TaskService.kt <<'EOF'
          package com.example.recordatorios

          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import android.widget.RemoteViewsService

          class TaskService : RemoteViewsService() {
              override fun onGetViewFactory(intent: Intent): RemoteViewsFactory = Factory(applicationContext)

              private class Factory(private val ctx: Context) : RemoteViewsFactory {
                  private var items: List<Task> = emptyList()

                  override fun onCreate() {}
                  override fun onDataSetChanged() { items = TaskStore.load(ctx).filter { !it.done } }
                  override fun onDestroy() {}
                  override fun getCount() = items.size

                  override fun getViewAt(position: Int): RemoteViews {
                      val t = items[position]
                      val rv = RemoteViews(ctx.packageName, R.layout.widget_item)
                      rv.setTextViewText(R.id.item_text, "☐  " + t.text)
                      rv.setOnClickFillInIntent(R.id.item_text, Intent().putExtra(TaskWidget.EXTRA_ID, t.id))
                      return rv
                  }

                  override fun getLoadingView(): RemoteViews? = null
                  override fun getViewTypeCount() = 1
                  override fun getItemId(position: Int) = items[position].id
                  override fun hasStableIds() = true
              }
          }
          EOF

          cat > $D/MainActivity.kt <<'EOF'
          package com.example.recordatorios

          import android.app.Activity
          import android.graphics.Paint
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.ListView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var input: EditText
              private lateinit var list: ListView
              private lateinit var adapter: TaskAdapter

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  input = findViewById(R.id.input)
                  list = findViewById(R.id.list)
                  adapter = TaskAdapter()
                  list.adapter = adapter
                  list.emptyView = findViewById(R.id.empty)

                  findViewById<Button>(R.id.add_button).setOnClickListener { addTask() }
                  input.setOnEditorActionListener { _, actionId, _ ->
                      if (actionId == EditorInfo.IME_ACTION_DONE) { addTask(); true } else false
                  }
              }

              override fun onResume() {
                  super.onResume()
                  reload()
              }

              private fun addTask() {
                  val text = input.text.toString()
                  if (text.isBlank()) return
                  TaskStore.add(this, text)
                  input.setText("")
                  reload()
              }

              private fun reload() {
                  val all = TaskStore.load(this)
                  adapter.setData(all.filter { !it.done } + all.filter { it.done })
              }

              private inner class TaskAdapter : BaseAdapter() {
                  private var data: List<Task> = emptyList()

                  fun setData(d: List<Task>) { data = d; notifyDataSetChanged() }
                  override fun getCount() = data.size
                  override fun getItem(position: Int): Any = data[position]
                  override fun getItemId(position: Int) = data[position].id

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val v = convertView ?: LayoutInflater.from(this@MainActivity)
                          .inflate(R.layout.item_task, parent, false)
                      val t = data[position]
                      val check = v.findViewById<CheckBox>(R.id.check)
                      val text = v.findViewById<TextView>(R.id.text)
                      val del = v.findViewById<ImageButton>(R.id.delete)

                      text.text = t.text
                      if (t.done) {
                          text.paintFlags = text.paintFlags or Paint.STRIKE_THRU_TEXT_FLAG
                          text.alpha = 0.5f
                      } else {
                          text.paintFlags = text.paintFlags and Paint.STRIKE_THRU_TEXT_FLAG.inv()
                          text.alpha = 1f
                      }

                      check.setOnCheckedChangeListener(null)
                      check.isChecked = t.done
                      check.setOnCheckedChangeListener { _, checked ->
                          TaskStore.setDone(this@MainActivity, t.id, checked)
                          reload()
                      }
                      del.setOnClickListener {
                          TaskStore.delete(this@MainActivity, t.id)
                          reload()
                      }
                      return v
                  }
              }
          }
          EOF

          cat > $R/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <EditText
                      android:id="@+id/input"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:hint="Algo que recordar…"
                      android:imeOptions="actionDone"
                      android:inputType="textCapSentences"
                      android:maxLines="1" />
                  <Button
                      android:id="@+id/add_button"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Añadir" />
              </LinearLayout>
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">
                  <ListView
                      android:id="@+id/list"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent" />
                  <TextView
                      android:id="@+id/empty"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:gravity="center"
                      android:text="No tienes nada pendiente"
                      android:textSize="16sp" />
              </FrameLayout>
          </LinearLayout>
          EOF

          cat > $R/layout/item_task.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:paddingTop="4dp"
              android:paddingBottom="4dp">
              <CheckBox
                  android:id="@+id/check"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:focusable="false" />
              <TextView
                  android:id="@+id/text"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:textColor="#212121"
                  android:textSize="17sp" />
              <ImageButton
                  android:id="@+id/delete"
                  android:layout_width="44dp"
                  android:layout_height="44dp"
                  android:background="?android:attr/selectableItemBackgroundBorderless"
                  android:contentDescription="Eliminar"
                  android:focusable="false"
                  android:src="@android:drawable/ic_menu_delete" />
          </LinearLayout>
          EOF

          cat > $R/layout/widget_layout.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:orientation="vertical"
              android:padding="10dp">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">
                  <TextView
                      android:id="@+id/widget_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Recordatorios"
                      android:textColor="#1565C0"
                      android:textSize="15sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/widget_add"
                      android:layout_width="36dp"
                      android:layout_height="36dp"
                      android:gravity="center"
                      android:text="+"
                      android:textColor="#1565C0"
                      android:textSize="24sp" />
              </LinearLayout>
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">
                  <ListView
                      android:id="@+id/widget_list"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:divider="@null" />
                  <TextView
                      android:id="@+id/widget_empty"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:gravity="center"
                      android:text="¡Todo hecho! 🎉"
                      android:textColor="#616161"
                      android:textSize="15sp" />
              </FrameLayout>
          </LinearLayout>
          EOF

          cat > $R/layout/widget_item.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/item_text"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:paddingTop="9dp"
              android:paddingBottom="9dp"
              android:textColor="#212121"
              android:textSize="16sp" />
          EOF

          cat > $R/drawable/widget_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F2FFFFFF" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat > $R/xml/task_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:initialLayout="@layout/widget_layout"
              android:minWidth="180dp"
              android:minHeight="180dp"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="0"
              android:widgetCategory="home_screen" />
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Recordatorios v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
